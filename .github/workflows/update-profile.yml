name: Update Profile README

on:
  schedule:
    - cron: "0 3 * * *"   # daily at 03:00 UTC
  workflow_dispatch:        # allows manual "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate animated snake SVG
        run: python scripts/generate_snake.py --out assets/snake.svg --color 6DB33F

      - name: Generate skills stats card
        run: python scripts/generate_stats_card.py --out assets/stats-card.svg

      - name: Update README with live GitHub stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_readme.py --username riyansh-ajmera --readme README.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/snake.svg assets/stats-card.svg README.md
          git diff --staged --quiet || git commit -m "chore: auto-update profile assets [skip ci]"
          git push
